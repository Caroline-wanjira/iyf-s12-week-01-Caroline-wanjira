<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <Link rel="stylesheet"href="styles.css">
</head>
<body>
<form action="https://formspree.io/f/mzezvobn" method="POST">
<h1>Contact Form</h1>
 <input type="text"name "first" placeholder="First name" autocomplete="off" required>
    <input type="text" name "last" placeholder="Last name"autocomplete="off" required>
    <input type="text" name "email" placeholder=" Email Address"autocomplete="off" required>
     <select name="service">
    <option value="car rental">car rental</option>
    <option value="car leasing">car leasing</option>
    <option value="car track installation">car track installation</option>
    </select>
    <textarea rows="5"name "message"placeholder="enter text" required></textarea>
    <label>
    <input type="checkbox"name="newsletter"value="subscribed"checked>
    </label>

    <button type="submit">Send message</button>
</form>
</body>
</html>
